  <style>
    :root {
      --deep: #1a0533;
      --purple: #3D2E81;
      --gold: #c9a84c;
      --cream: #f5f0e8;
      --light: #faf8f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--deep);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo animado */
    .bg-layer {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(61,46,129,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(61,46,129,0.3) 0%, transparent 50%);
      z-index: 0;
    }

    /* Patrón de puntos */
    .bg-dots {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }

    /* NAVBAR */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .btn-admin {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.4);
      background: rgba(201,168,76,0.08);
      padding: 8px 20px;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-admin:hover {
      background: rgba(201,168,76,0.18);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* HERO */
    .hero {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 40px 20px 20px;
    }

    .hero-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      font-weight: 700;
      color: var(--cream);
      line-height: 0.9;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.4s;
    }

    .hero-title span {
      color: var(--gold);
      font-style: italic;
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: rgba(245,240,232,0.5);
      letter-spacing: 0.05em;
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.6s;
    }

    /* DIVIDER decorativo */
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 60px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    /* CARDS */
    .cards-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 0 40px 80px;
      flex-wrap: wrap;
    }

    .card-item {
      width: 280px;
      background: rgba(245,240,232,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 4px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s ease;
      text-decoration: none;
      display: block;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .card-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card-item:hover::before { opacity: 1; }

    .card-item:nth-child(1) { animation-delay: 0.8s; }
    .card-item:nth-child(2) { animation-delay: 1.0s; }

    .card-item:hover {
      transform: translateY(-8px);
      border-color: rgba(201,168,76,0.6);
      background: rgba(245,240,232,0.07);
    }

    .card-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 50%;
      font-size: 1.8rem;
      color: var(--gold);
      transition: all 0.4s ease;
    }

    .card-item:hover .card-icon {
      background: rgba(201,168,76,0.12);
      border-color: var(--gold);
    }

    .card-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.02em;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.78rem;
      color: rgba(245,240,232,0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-arrow {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--gold);
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.3s ease;
      letter-spacing: 0.15em;
    }

    .card-item:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* Footer logos */
    .footer-logos {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 24px 40px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .footer-logos img {
      height: 36px;
      opacity: 0.5;
      filter: brightness(0) invert(1);
      transition: opacity 0.3s;
    }

    .footer-logos img:hover { opacity: 0.8; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
