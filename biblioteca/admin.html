<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración de Libros</title>
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f8f8f8; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #3D2E81; color: white; }
        .btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .edit-btn { background-color: #FFC107; color: black; }
        .delete-btn { background-color: #DC3545; color: white; }
    </style>
</head>
<body>

    <h2>Libros Registrados (Administrador)</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Editorial</th>
                <th>Clasificación</th>
                <th>Autor</th>
                <th>Código</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="librosTabla">
            <tr>
                <td>Libro 1</td>
                <td>Editorial A</td>
                <td>Ciencia</td>
                <td>Autor A</td>
                <td>12345</td>
                <td>
                    <button class="btn edit-btn">Editar</button>
                    <button class="btn delete-btn" onclick="eliminarFila(this)">Borrar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <button onclick="cerrarSesion()">Cerrar sesión</button>

    <script>
        // Redirección si no se hizo login
        if (localStorage.getItem('logueado') !== 'true') {
            alert('Debes iniciar sesión primero.');
            location.href = 'login.html';
        }

        function eliminarFila(boton) {
            if (confirm('¿Estás seguro de eliminar este libro?')) {
                const fila = boton.parentElement.parentElement;
                fila.remove();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('logueado');
            location.href = 'buscar.html';
        }
    </script>

</body>
</html>
