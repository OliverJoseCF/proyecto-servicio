<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Libros - Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1e1040;
      --bg-surface: #130d22;
      --bg-card: rgba(255, 255, 255, 0.025);
      --purple-accent: rgba(61, 46, 129, 0.3);
      --gold: #c9a050;
      --gold-dim: rgba(201, 160, 80, 0.5);
      --gold-glow: rgba(201, 160, 80, 0.08);
      --gold-border: rgba(201, 160, 80, 0.15);
      --text-primary: #f0ece4;
      --text-muted: rgba(240, 236, 228, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Ambient ── */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -15%;
      width: 55%; height: 55%;
      background: radial-gradient(ellipse, rgba(61, 46, 129, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -25%; right: -15%;
      width: 50%; height: 50%;
      background: radial-gradient(ellipse, rgba(201, 160, 80, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .grain {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── Navbar ── */
    .navbar-custom {
      position: relative; z-index: 10;
      background: rgba(21, 11, 48, 0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(201, 160, 80, 0.08);
      padding: 0.85rem 0;
    }
    .navbar-custom .navbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: var(--text-primary) !important;
    }
    .navbar-custom .navbar-brand i { color: var(--gold-dim); }
    .btn-back {
      color: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: 50px;
      padding: 0.35rem 1rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      background: rgba(201, 160, 80, 0.03);
    }
    .btn-back:hover {
      background: var(--gold);
      color: var(--bg-deep);
      border-color: var(--gold);
    }

    /* ── Page header ── */
    .page-header {
      position: relative; z-index: 10;
      text-align: center;
      padding: 2.5rem 1rem 0;
    }
    .page-header-line {
      width: 40px; height: 1px;
      background: var(--gold);
      margin: 0 auto 1.25rem;
      opacity: 0;
      animation: scaleIn 0.8s 0.2s ease forwards;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-primary);
      opacity: 0;
      animation: fadeUp 0.7s 0.4s ease forwards;
    }
    .page-header h1 .gold { color: var(--gold); }
    .page-header-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.55s ease forwards;
    }

    /* ── Search card ── */
    .search-card {
      position: relative; z-index: 10;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border);
      border-radius: 18px;
      padding: 1.75rem;
      margin: 2rem auto 2rem;
      max-width: 900px;
      opacity: 0;
      animation: fadeUp 0.6s 0.65s ease forwards;
    }
    .search-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.4rem;
    }
    .search-card .form-control,
    .search-card .form-select {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: var(--text-primary) !important;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
    }
    .search-card .form-control::placeholder { color: var(--text-muted); }
    .search-card .form-control:focus,
    .search-card .form-select:focus {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(201, 160, 80, 0.35) !important;
      box-shadow: 0 0 20px rgba(201, 160, 80, 0.08);
      outline: none;
    }
    .search-card .form-select option {
      background: #1a1030;
      color: #fff;
    }

    /* ── Table ── */
    .table-wrapper {
      position: relative; z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      opacity: 0;
      animation: fadeUp 0.6s 0.8s ease forwards;
    }
    .table-wrapper .table {
      margin-bottom: 0;
      background: rgba(255, 255, 255, 0.02);
      --bs-table-bg: transparent;
      --bs-table-color: var(--text-primary);
      --bs-table-hover-bg: rgba(201, 160, 80, 0.04);
      --bs-table-hover-color: var(--text-primary);
      --bs-table-striped-bg: transparent;
      --bs-table-border-color: rgba(255, 255, 255, 0.04);
    }
    .table-wrapper .table thead th {
      background: rgba(61, 46, 129, 0.25) !important;
      color: var(--gold) !important;
      font-family: 'Outfit', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 1rem 0.85rem;
      border-bottom: 1px solid var(--gold-border) !important;
      white-space: nowrap;
    }
    .table-wrapper .table tbody td {
      color: #e8e4dc !important;
      padding: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
      font-size: 0.85rem;
      vertical-align: middle;
      background: transparent !important;
    }
    .table tbody tr {
      transition: background 0.25s ease;
    }
    .table-wrapper .table tbody tr:hover {
      background: rgba(201, 160, 80, 0.06) !important;
    }
    .table-wrapper .table tbody tr:hover td {
      color: #fff !important;
      background: transparent !important;
    }
    .table tbody tr:last-child td {
      border-bottom: none !important;
    }

    /* ── Badges ── */
    .badge-code {
      background: rgba(201, 160, 80, 0.1);
      color: var(--gold);
      border: 1px solid var(--gold-border);
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.3em 0.7em;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 0.62rem;
      padding: 0.3em 0.75em;
      border-radius: 50px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .status-available {
      background: rgba(39, 174, 96, 0.15);
      color: #5ce08a;
    }
    .status-busy {
      background: rgba(231, 76, 60, 0.15);
      color: #f07070;
    }

    /* Title in table */
    .table-wrapper .table .book-title {
      font-weight: 600;
      color: #ffffff !important;
      font-size: 0.88rem;
    }
    /* Override Bootstrap .text-muted inside our dark table */
    .table-wrapper .table tbody td.text-muted,
    .table-wrapper .table tbody .text-muted {
      color: rgba(201, 160, 80, 0.5) !important;
    }

    /* ── Buttons ── */
    .btn-gold {
      background: var(--gold);
      color: var(--bg-deep);
      font-weight: 700;
      border-radius: 8px;
      border: none;
      font-size: 0.72rem;
      padding: 0.4rem 1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      background: #d4ac5a;
      color: var(--bg-deep);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(201, 160, 80, 0.3);
    }
    .btn-disabled {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      font-size: 0.72rem;
      padding: 0.4rem 1rem;
      cursor: not-allowed;
      font-weight: 500;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .empty-state i {
      font-size: 2rem;
      color: rgba(201, 160, 80, 0.2);
      margin-bottom: 1rem;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    /* ── Responsive ── */
    @media (max-width: 767.98px) {
      .search-card { padding: 1.25rem; margin: 1.5rem 0.75rem; }
      .table-wrapper { margin: 0 0.75rem; border-radius: 14px; }
      .table thead th { font-size: 0.62rem; padding: 0.75rem 0.5rem; }
      .table tbody td { font-size: 0.8rem; padding: 0.7rem 0.5rem; }
      .page-header { padding: 1.75rem 1rem 0; }
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-dark navbar-custom shadow-sm mb-0">
    <div class="container-fluid px-3 px-md-4">
      <span class="navbar-brand mb-0"><i class="fas fa-search me-2"></i>Explorar Biblioteca</span>
      <a href="index.html" class="btn-back"><i class="fas fa-arrow-left me-1"></i> Volver</a>
    </div>
  </nav>

  <!-- ── Header ── -->
  <div class="page-header">
    <div class="page-header-line"></div>
    <h1>Catálogo de <span class="gold">Libros</span></h1>
    <p class="page-header-sub">Busca y solicita préstamos del acervo bibliotecario</p>
  </div>

  <div class="container pb-5">

    <!-- ── Search ── -->
    <div class="search-card">
      <div class="row g-3 align-items-end">
        <div class="col-md-3 col-sm-4">
          <label class="search-label">Filtrar por</label>
          <select id="filterField" class="form-select">
            <option value="all">Todos los campos</option>
            <option value="titulo">Título</option>
            <option value="autor">Autor</option>
          </select>
        </div>
        <div class="col-md-9 col-sm-8">
          <label class="search-label">Buscar libro</label>
          <input type="text" id="searchInput" class="form-control" placeholder="Escriba título o autor..." onkeyup="filtrarLibros()">
        </div>
      </div>
    </div>

    <!-- ── Table ── -->
    <div class="table-wrapper">
      <div class="table-responsive">
        <table class="table align-middle text-center" id="tablaLibros">
          <thead>
            <tr>
              <th>ID</th><th>Código</th><th class="text-start">Título / Estado</th><th>Autor</th><th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    window.onload = function() {
        fetch('procesos/obtenerLibros.php')
            .then(res => res.json())
            .then(data => {
                if(data.error) throw new Error(data.error);
                window.todosLosLibros = data;
                filtrarLibros(); 
            })
            .catch(err => {
                document.querySelector("#tablaLibros tbody").innerHTML = `<tr><td colspan="5" class="empty-state"><i class="fas fa-exclamation-circle d-block"></i>Error: ${err.message}</td></tr>`;
            });
    };

    function filtrarLibros() {
        const text = document.getElementById('searchInput').value.toLowerCase();
        const field = document.getElementById('filterField').value;
        const tbody = document.querySelector("#tablaLibros tbody");
        tbody.innerHTML = "";
        if (!window.todosLosLibros) return;

        const filtrados = window.todosLosLibros.filter(l => {
            if (field === 'all') return Object.values(l).some(v => v && v.toString().toLowerCase().includes(text));
            return l[field] && l[field].toString().toLowerCase().includes(text);
        });

        if (filtrados.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-state"><i class="fas fa-book-open d-block"></i>No se encontraron libros</td></tr>`;
            return;
        }

        filtrados.forEach(l => {
            const ocupado = l.ocupado > 0;
            const fila = document.createElement("tr");
            const urlDestino = `solicitudDeLibros.php?titulo=${encodeURIComponent(l.titulo)}&codigo=${encodeURIComponent(l.folio)}`;

            fila.innerHTML = `
                <td class="text-muted">${l.id}</td>
                <td><span class="badge-code">${l.folio}</span></td>
                <td class="text-start">
                    <div class="book-title">${l.titulo}</div>
                    <span class="status-badge ${ocupado ? 'status-busy' : 'status-available'}">
                        ${ocupado ? 'En Préstamo' : 'Disponible'}
                    </span>
                </td>
                <td>${l.autor}</td>
                <td>
                    ${ocupado ? 
                        `<button class="btn-disabled" disabled>Ocupado</button>` : 
                        `<a href="${urlDestino}" class="btn btn-gold btn-sm">Solicitar</a>`
                    }
                </td>`;
            tbody.appendChild(fila);
        });
    }
  </script>
</body>
</html>
