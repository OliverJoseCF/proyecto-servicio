<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Menú de Opciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #1e1040;
            --bg-surface: #130d22;
            --gold: #c9a050;
            --gold-dim: rgba(201, 160, 80, 0.5);
            --gold-glow: rgba(201, 160, 80, 0.08);
            --gold-border: rgba(201, 160, 80, 0.12);
            --text-primary: #f0ece4;
            --text-muted: rgba(240, 236, 228, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Ambient background ── */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(61, 46, 129, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(201, 160, 80, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Grain overlay ── */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ── Top bar ── */
        .top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            padding: 1.5rem 2rem;
        }
        .btn-top-home {
            color: var(--gold-dim);
            text-decoration: none;
            font-weight: 500;
            border: 1px solid var(--gold-border);
            padding: 0.45rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.35s ease;
            backdrop-filter: blur(8px);
            background: rgba(201, 160, 80, 0.03);
        }
        .btn-top-home:hover {
            background: var(--gold);
            color: var(--bg-deep);
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(201, 160, 80, 0.2);
        }

        /* ── Hero section ── */
        .hero {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem 1.5rem 0;
        }

        .hero-line {
            display: block;
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 1.5rem;
            opacity: 0;
            animation: fadeExpand 1s 0.3s ease forwards;
        }

        .hero-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            opacity: 0;
            animation: fadeUp 0.8s 0.5s ease forwards;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-primary);
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s 0.7s ease forwards;
        }
        .hero-title .gold { color: var(--gold); }

        .hero-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1.5rem auto 0;
            opacity: 0;
            animation: fadeExpand 1s 0.9s ease forwards;
        }

        /* ── Cards section ── */
        .cards-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: 3rem 1.5rem;
        }

        .cards-grid {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .option-card {
            position: relative;
            width: 280px;
            padding: 3rem 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            background: linear-gradient(165deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.005) 100%);
            border: 1px solid var(--gold-border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
        }
        .option-card:nth-child(1) { animation: cardReveal 0.7s 1.1s ease forwards; }
        .option-card:nth-child(2) { animation: cardReveal 0.7s 1.3s ease forwards; }

        /* Card shimmer */
        .option-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 160, 80, 0.04), transparent);
            transition: left 0.8s ease;
        }
        .option-card:hover::before { left: 100%; }

        /* Card top accent */
        .option-card::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            transition: width 0.5s ease;
        }
        .option-card:hover::after { width: 80%; }

        .option-card:hover {
            border-color: rgba(201, 160, 80, 0.35);
            transform: translateY(-8px);
            background: linear-gradient(165deg, rgba(255,255,255,0.05) 0%, rgba(201, 160, 80, 0.02) 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(201, 160, 80, 0.06);
        }

        /* ── Card icon ── */
        .card-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            position: relative;
            background: var(--gold-glow);
            border: 1px solid var(--gold-border);
            transition: all 0.5s ease;
        }
        .card-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--gold-dim);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.4s ease;
        }
        .option-card:hover .card-icon {
            background: rgba(201, 160, 80, 0.12);
            border-color: rgba(201, 160, 80, 0.3);
            box-shadow: 0 0 30px rgba(201, 160, 80, 0.1);
        }
        .option-card:hover .card-icon svg {
            stroke: var(--gold);
        }

        /* Ring pulse on hover */
        .card-icon::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: all 0.5s ease;
        }
        .option-card:hover .card-icon::before {
            border-color: rgba(201, 160, 80, 0.15);
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .option-card:hover .card-title { color: #fff; }

        .card-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .option-card:hover .card-subtitle { color: var(--gold-dim); }

        /* ── Card arrow hint ── */
        .card-arrow {
            margin-top: 1.5rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.4s ease;
        }
        .card-arrow i {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.15);
            transition: all 0.4s ease;
        }
        .option-card:hover .card-arrow {
            border-color: var(--gold-border);
            background: var(--gold-glow);
        }
        .option-card:hover .card-arrow i {
            color: var(--gold);
            transform: translateX(2px);
        }

        /* ── Footer ── */
        .footer-logos {
            position: relative;
            z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 1.5rem 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo-container img {
            height: 35px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }
        .logo-container img:hover { opacity: 0.7; }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeExpand {
            from { opacity: 0; width: 0; }
            to   { opacity: 1; width: 60px; }
        }
        .hero-line { --target-width: 40px; }
        @keyframes fadeExpand {
            from { opacity: 0; transform: scaleX(0); }
            to   { opacity: 1; transform: scaleX(1); }
        }
        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        /* ── Responsive ── */
        @media (max-width: 767.98px) {
            .top-bar { padding: 1rem 1.25rem; }
            .hero { padding: 1.5rem 1rem 0; }
            .cards-section { padding: 2rem 1rem; }
            .cards-grid { gap: 1.5rem; }
            .option-card {
                width: 100%;
                max-width: 320px;
                padding: 2.5rem 1.5rem 2rem;
            }
            .logo-container { gap: 1.25rem; }
            .logo-container img { height: 28px; }
        }

        @media (max-width: 400px) {
            .option-card { padding: 2rem 1.25rem 1.75rem; }
            .card-icon { width: 68px; height: 68px; }
            .card-icon svg { width: 28px; height: 28px; }
        }
    </style>
</head>

                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        </div>
    </div>

    <!-- ── Footer ── -->
    <footer class="footer-logos">
        <div class="container logo-container">
            <img src="assets/img/1.png" alt="Logo 1">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
