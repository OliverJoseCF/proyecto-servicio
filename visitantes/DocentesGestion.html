<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCENTES - Administración</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #4B0082;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        h1 {
            background-color: #5757c0;
            padding: 30px 0;
            font-size: 40px;
            font-weight: bold;
            margin: 0;
        }

        .docentes {
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #5757c0;
            color: white;
            text-align: center;
        }

        /* Filas alternas para mejor lectura */
        tbody tr:nth-child(even) { background-color: #f2f2f2; }
        tbody tr:hover { background-color: #ddd; }

        .foto-tabla {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 10px;
            border: 1px solid #ccc;
        }

        /* Botones de acción */
        .btn-acc {
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-edit { background-color: #ffc107; color: black; margin-right: 5px; }
        .btn-del { background-color: #dc3545; color: white; }

        /* PANEL DE ADMINISTRACIÓN ABAJO */
        .admin-panel {
            background-color: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            margin: 20px auto 50px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-panel input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            background: #333;
            padding: 20px;
            width: 100%;
            margin-top: auto;
        }
        .footer img { margin: 15px; }
        
        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <h1>DOCENTES</h1>

    <div class="docentes">
        <h2>Lista de Docentes</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th style="width: 160px; text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                </tbody>
        </table>
    </div>

    <div class="admin-panel">
        <h3 id="panel-titulo" style="margin:0; color:#4B0082;">Gestionar Maestro</h3>
        <input type="hidden" id="edit-idx" value="">
        <input type="text" id="nombre-input" placeholder="Nombre completo del docente">
        <input type="text" id="foto-input" placeholder="Nombre de imagen (ej: carlos.png)">
        <button class="btn-save" onclick="guardarCambios()">Guardar en Lista</button>
    </div>

    <a href="index.html" class="top-right">
        <img src="imagenes/casa.png" alt="Inicio" style="width: 80px; height: auto;">
    </a>

    <div class="footer">
        <img src="imagenes/image.png" alt="Logo 1" style="width: 160px;"> 
        <img src="imagenes/image2.png" alt="Logo 2" style="width: 100px;"> 
        <img src="imagenes/image3.png" alt="Logo 3" style="width: 160px;"> 
        <img src="imagenes/image4.png" alt="Logo 4" style="width: 60px;"> 
    </div>

    <script>
        // Lista original de tu código
        const iniciales = [
            { nombre: "Carlos Ramírez", foto: "user.png" },
            { nombre: "Fidel Rodríguez", foto: "user.png" },
            { nombre: "Alberto Chavoya", foto: "user.png" },
            { nombre: "Alma González", foto: "user.png" },
            { nombre: "José Aguilera", foto: "user.png" },
            { nombre: "María Estrada", foto: "user.png" }
        ];

        let docentes = JSON.parse(localStorage.getItem("docentes_final_v5")) || iniciales;

        function renderizar() {
            const tbody = document.getElementById("tablaBody");
            tbody.innerHTML = "";
            docentes.forEach((d, i) => {
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <img src="imagenes/${d.foto}" class="foto-tabla" onerror="this.src='imagenes/user.png'">
                            ${d.nombre}
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-acc btn-edit" onclick="cargarParaEditar(${i})">Editar</button>
                            <button class="btn-acc btn-del" onclick="eliminar(${i})">Borrar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function guardarCambios() {
            const nom = document.getElementById("nombre-input").value;
            let fot = document.getElementById("foto-input").value || "user.png";
            const idx = document.getElementById("edit-idx").value;

            if (nom === "") return alert("Debes escribir un nombre");

            fot = fot.replace("imagenes/", "");

            if (idx === "") {
                docentes.push({ nombre: nom, foto: fot });
            } else {
                docentes[idx] = { nombre: nom, foto: fot };
                document.getElementById("edit-idx").value = "";
                document.getElementById("panel-titulo").innerText = "Gestionar Maestro";
            }

            localStorage.setItem("docentes_final_v5", JSON.stringify(docentes));
            limpiarForm();
            renderizar();
        }

        function cargarParaEditar(i) {
            document.getElementById("nombre-input").value = docentes[i].nombre;
            document.getElementById("foto-input").value = docentes[i].foto;
            document.getElementById("edit-idx").value = i;
            document.getElementById("panel-titulo").innerText = "Modificando a: " + docentes[i].nombre;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function eliminar(i) {
            if (confirm("¿Seguro que quieres borrar a este docente?")) {
                docentes.splice(i, 1);
                localStorage.setItem("docentes_final_v5", JSON.stringify(docentes));
                renderizar();
            }
        }

        function limpiarForm() {
            document.getElementById("nombre-input").value = "";
            document.getElementById("foto-input").value = "";
        }

        renderizar();
    </script>
</body>
</html>
